<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aw-token" content="%%AW_TOKEN%%">
<title>Agents do Wash</title>
<style>
  :root { --bg:#f3ede4; --panel:rgba(255,255,255,.82); --ink:#2b2a33; --muted:#7a7685; --accent:#d97757; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font: 13px/1.4 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; }
  #scene { position:fixed; inset:0; }
  #hud { position:fixed; top:16px; left:16px; display:flex; gap:10px; align-items:center; pointer-events:none; }
  #hud h1 { margin:0; font-size:18px; letter-spacing:-.02em; }
  #home, #bossBtn, #secBtn, #cleanBtn, #ctoBtn, #zoomIn, #zoomOut, #goto, #tourBtn { pointer-events:auto; border:0; cursor:pointer; font:inherit; color:var(--ink); }
  #goto { appearance:none; }
  #cFollow.on { color:#5fd38d; }
  #bossBtn.off, #secBtn.off, #cleanBtn.off, #ctoBtn.off { opacity:.45; }
  #skin { pointer-events:auto; border:0; cursor:pointer; font:inherit; color:var(--ink); appearance:none; padding-right:14px; }
  .pill { background:var(--panel); backdrop-filter: blur(8px); padding:6px 12px; border-radius:999px;
    box-shadow:0 2px 10px rgba(0,0,0,.06); font-variant-numeric: tabular-nums; }
  #status::before { content:'●'; margin-right:6px; color:#c9c4bb; }
  #status.live::before { color:#4caf50; }
  #side { position:fixed; top:16px; right:16px; bottom:16px; width:320px; display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--panel); backdrop-filter: blur(10px); border-radius:14px; padding:12px 14px;
    box-shadow:0 4px 20px rgba(0,0,0,.07); }
  .card h2 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  #roster { max-height:38vh; overflow:auto; }
  .agent { display:flex; align-items:center; gap:8px; padding:5px 4px; border-radius:8px; cursor:pointer; }
  .agent:hover { background:rgba(0,0,0,.04); }
  .agent .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .agent .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .agent .nm small { color:var(--muted); }
  .agent .branch { color:var(--muted); margin-right:-2px; }
  .agent .tk { color:var(--muted); font-variant-numeric: tabular-nums; }
  #feedCard { flex:1; min-height:0; display:flex; flex-direction:column; }
  #feed { flex:1; overflow:auto; display:flex; flex-direction:column; gap:6px; }
  .ev { padding:6px 8px; border-radius:8px; background:rgba(0,0,0,.03); border-left:3px solid #ccc; }
  .ev b { font-weight:600; }
  .ev .meta { color:var(--muted); font-size:11px; }
  #empty { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); }
  /* terminal da sessão */
  #composer { --t-bg:#1c1b22; --t-fg:#e8e4dc; --t-dim:#8d8996; --t-line:rgba(255,255,255,.08);
    position:fixed; left:16px; bottom:16px; width:min(780px, calc(100% - 368px)); height:min(52vh, 560px);
    display:flex; flex-direction:column; background:var(--t-bg); color:var(--t-fg); border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.35); overflow:hidden;
    font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #composer[hidden] { display:none; }
  #composer .who { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--t-line);
    font: 600 12px -apple-system, system-ui, sans-serif; }
  #composer .who .dot { width:10px; height:10px; border-radius:50%; }
  #composer .who b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #composer .who small { color:var(--t-dim); font-weight:400; }
  #cRenameInput { flex:1; min-width:0; background:rgba(255,255,255,.08); color:var(--t-fg); border:1px solid rgba(255,255,255,.25);
    border-radius:6px; padding:3px 8px; font: 600 12px -apple-system, system-ui, sans-serif; }
  #cSub { padding:6px 12px; border-bottom:1px solid var(--t-line); }
  #cSub a { color:#f0a27f; }
  #termLog { flex:1; overflow:auto; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .tl { white-space:pre-wrap; word-break:break-word; }
  .tl.user { color:#f0a27f; }
  .tl.user::before { content:'❯ '; }
  .tl.text::before { content:'⏺ '; color:var(--t-fg); }
  .tl.tool::before { content:'⏺ '; color:#5fd38d; }
  .tl.tool b { font-weight:700; }
  .tl.result { color:var(--t-dim); padding-left:2ch; }
  .tl.result::before { content:'⎿ '; }
  .tl.result.err { color:#ff7b72; }
  .tl.result .more { color:#7aa7ff; cursor:pointer; }
  .tl.sys { color:var(--t-dim); font-style:italic; }
  .tl.sys.err { color:#ff7b72; }
  #composer .row { display:flex; align-items:flex-start; gap:8px; padding:8px 12px; border-top:1px solid var(--t-line); }
  #composer .row .ps { color:#f0a27f; line-height:30px; }
  #composer textarea { flex:1; resize:none; min-height:30px; max-height:140px; border:0; padding:5px 0; font:inherit;
    background:transparent; color:var(--t-fg); }
  #composer textarea:focus { outline:none; }
  #composer textarea:disabled { opacity:.45; }
  #cStatus { padding:0 12px 8px; color:var(--t-dim); font: 11px -apple-system, system-ui, sans-serif; min-height:1em; }
  #cStatus.err { color:#ff7b72; }
  #composer button { border:0; border-radius:8px; padding:6px 12px; font: 600 12px -apple-system, system-ui, sans-serif; cursor:pointer; background:var(--accent); color:#fff; }
  #composer button.ghost { background:transparent; color:var(--t-dim); padding:2px 6px; font-size:14px; }
  #composer button.warn { background:#c0392b; }
  #composer button:disabled { opacity:.45; cursor:default; }
  .hint { color:var(--muted); font-size:12px; }
  /* modo apresentação */
  body.touring #hud > :not(h1) { display:none; }
  body.touring #empty { display:none; }
  #tour[hidden] { display:none; }
  #tourCap { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); width:min(880px, calc(100% - 32px));
    background:rgba(28,27,34,.88); color:#fff; border-radius:18px; padding:18px 26px 16px; box-shadow:0 18px 50px rgba(0,0,0,.35);
    backdrop-filter: blur(6px); transition: opacity .3s; }
  #tourCap.hidden { opacity:0; }
  #tourKicker { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#f0a27f; font-weight:700; }
  #tourTitle { margin:4px 0 6px; font-size:30px; letter-spacing:-.02em; }
  #tourText { margin:0; font-size:17px; line-height:1.45; color:#dcd8d0; }
  .tbar { margin-top:12px; height:4px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; }
  .tbar i { display:block; height:100%; width:0; background:#f0a27f; }
  #tourPause { position:fixed; top:44px; left:50%; transform:translateX(-50%); background:rgba(28,27,34,.85); color:#fff; padding:6px 14px; border-radius:999px; font-weight:600; }
  #tourHint { position:fixed; top:18px; left:50%; transform:translateX(-50%); color:rgba(43,42,51,.55); font-size:11px; white-space:nowrap; }
  #slackDemo { position:fixed; right:24px; top:70px; width:min(460px, calc(100% - 48px)); background:#1d1c22; color:#e8e4dc; border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.35); padding:14px 16px; display:flex; flex-direction:column; gap:10px; font-size:14px; line-height:1.45; }
  #slackDemo[hidden] { display:none; }
  .sd-h { font-weight:700; color:#bcb7c4; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .sd-m { background:rgba(255,255,255,.05); border-radius:10px; padding:8px 10px; animation: sdIn .35s ease; }
  .sd-m.me { background:rgba(240,162,127,.12); }
  .sd-who { display:block; font-size:12px; color:#f0a27f; margin-bottom:2px; }
  @keyframes sdIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
  @media (max-width: 720px) { #side { top:auto; left:16px; width:auto; height:34vh; } #composer { width:auto; right:16px; bottom:calc(34vh + 26px); height:44vh; } }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <h1>🏢 Agents do Wash</h1>
  <span id="status" class="pill">conectando…</span>
  <span id="tokens" class="pill">0 tokens</span>
  <span id="botpill" class="pill" hidden></span>
  <select id="skin" class="pill" title="Visual dos agentes"></select>
  <button id="bossBtn" class="pill" title="Liga/desliga o chefe">👔</button>
  <button id="secBtn" class="pill" title="Liga/desliga o head de segurança">🛡️</button>
  <button id="cleanBtn" class="pill" title="Liga/desliga o robô de limpeza">🤖</button>
  <button id="ctoBtn" class="pill" title="Liga/desliga o CTO">💪</button>
  <select id="goto" class="pill" title="Ir para um lugar"></select>
  <button id="zoomIn" class="pill" title="Aproximar (+)">➕</button>
  <button id="zoomOut" class="pill" title="Afastar (−)">➖</button>
  <button id="home" class="pill" title="Visão geral">🏠</button>
  <button id="tourBtn" class="pill" title="Modo apresentação">🎬</button>
</div>
<div id="side">
  <div class="card"><h2>Moradores <span class="hint" style="text-transform:none;letter-spacing:0">· clique para falar ou renomear ✏️</span></h2><div id="roster"></div></div>
  <div class="card" id="feedCard"><h2>Ao vivo</h2><div id="feed"></div></div>
</div>
<div id="composer" hidden>
  <div class="who"><span class="dot" id="cDot"></span><b id="cTo"></b><button class="ghost" id="cFollow" title="Câmera segue este agente">🎥</button><button class="ghost" id="cRename" title="Renomear este agente">✏️</button><button class="ghost" id="cClose" title="Fechar (Esc)">✕</button></div>
  <div id="cSub" class="hint" hidden></div>
  <div id="termLog"></div>
  <div class="row"><span class="ps">❯</span>
    <textarea id="cText" rows="1" placeholder="Mensagem para o agente (Enter envia, Shift+Enter quebra a linha)"></textarea>
    <button id="cSend">Enviar</button></div>
  <div id="cStatus"></div>
</div>
<div id="tour" hidden>
  <div id="tourCap">
    <div id="tourKicker"></div>
    <h2 id="tourTitle"></h2>
    <p id="tourText"></p>
    <div class="tbar"><i id="tourBar"></i></div>
  </div>
  <div id="tourPause" hidden>⏸ pausado</div>
  <div id="tourHint">→ próximo · ← anterior · espaço pausa · H esconde a legenda · Esc sai</div>
</div>
<div id="slackDemo" hidden></div>
<div id="empty" class="pill">Nenhum agente ativo — rode o Claude Code ou abra <a href="?demo">?demo</a></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildWorld } from './office.js';
import { makeBuddy, SKINS, HERO_COUNT } from './buddy.js';

// ---------- cena ----------
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9efe4');

const VIEW = 30;
const FOCUS = new THREE.Vector3(14, 0, 0);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 600);
camera.position.copy(FOCUS).add(new THREE.Vector3(55, 50, 55));
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.3;
controls.minZoom = 0.4; controls.maxZoom = 12;
controls.zoomToCursor = true; // a rodinha aproxima para onde o mouse aponta
controls.target.copy(FOCUS);
camera.zoom = 1.05;

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h);
  camera.left = -VIEW * a; camera.right = VIEW * a; camera.top = VIEW; camera.bottom = -VIEW;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight('#ffffff', '#b9c4a8', 1.15));
const sun = new THREE.DirectionalLight('#fff4e0', 1.7);
sun.position.copy(FOCUS).add(new THREE.Vector3(30, 60, 25));
sun.target.position.copy(FOCUS);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -.0005;
Object.assign(sun.shadow.camera, { left: -65, right: 65, top: 65, bottom: -65, far: 200 });
scene.add(sun, sun.target);

function label(text, { size = 28, bg = 'rgba(255,255,255,.92)', color = '#2b2a33', maxW = 420 } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const font = `600 ${size}px -apple-system, system-ui, sans-serif`;
  g.font = font;
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  lines.push(cur);
  const shown = lines.slice(0, 3);
  const w = Math.min(maxW, Math.max(...shown.map(l => g.measureText(l).width))) + 28;
  const h = shown.length * size * 1.25 + 18;
  c.width = w; c.height = h;
  g.font = font; g.fillStyle = bg;
  g.beginPath(); g.roundRect(0, 0, w, h, 14); g.fill();
  g.fillStyle = color; g.textBaseline = 'top';
  shown.forEach((l, i) => g.fillText(l, 14, 9 + i * size * 1.25));
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  s.scale.set(w / 42, h / 42, 1); s.renderOrder = 10;
  return s;
}

const world = buildWorld(scene, label);
const { stations, desks, seats, coffeeSpots, DOOR } = world;

const STATION_FOR = tool => {
  if (/^(Read|Grep|Glob|LS|NotebookRead)$/.test(tool)) return 'library';
  if (/^(Bash|BashOutput|KillShell|Monitor)$/.test(tool)) return 'terminal';
  if (/^(WebFetch|WebSearch)$|claude-in-chrome|Microsoft_Learn/.test(tool)) return 'web';
  if (/^(Agent|Task|SendMessage|Workflow|ListAgents)$/.test(tool)) return 'meeting';
  if (/Atlassian/.test(tool)) return 'jira';
  if (/Slack/.test(tool)) return 'slack';
  if (/^mcp__/.test(tool)) return 'mail';
  return 'desk'; // Edit, Write, TodoWrite, Skill...
};
const ICON = { library: '📚', terminal: '🖥️', web: '🌐', meeting: '🤝', mail: '📮', jira: '📋', slack: '💬', desk: '✍️' };
// mcp__claude_ai_Atlassian__getJiraIssue → getJiraIssue
const prettyTool = t => t.startsWith('mcp__') ? t.split('__').pop() : t;
const EMOTE_AT = { library: 'Yes', terminal: 'Punch', web: 'ThumbsUp', meeting: 'Wave', mail: 'Yes', jira: 'Yes', slack: 'Wave' };

// ---------- personagens ----------
const PALETTE = ['#6a9bd8', '#7bb37b', '#b07cc6', '#e7a33e', '#4fb3b3', '#e46a8f', '#8d7bd6', '#9aa84a', '#5f8fd0', '#d97757'];
const hash = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const colorFor = a => a.kind === 'main' ? '#3d6fb6' : PALETTE[hash(a.type) % PALETTE.length];

// herói sorteado para cada agente: um "baralho" embaralhado por visual, que só repete depois de sair todo mundo
const heroBags = {}, heroOf = new Map();
function heroFor(a) {
  if (!HERO_COUNT[skin]) return undefined;
  const key = skin + ':' + a.id;
  if (!heroOf.has(key)) {
    if (!heroBags[skin]?.length) {
      const bag = [...Array(HERO_COUNT[skin]).keys()];
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      heroBags[skin] = bag;
    }
    heroOf.set(key, heroBags[skin].pop());
  }
  return heroOf.get(key);
}
// "proprio": cada agente usa o estilo e o herói que escolheu ao chegar (guardados no servidor)
const buddyFor = (a, color) => skin === 'proprio'
  ? makeBuddy({ color, main: a.kind === 'main', seed: hash(a.id), skin: a.identity?.style || 'classico', palette: a.identity?.palette })
  : makeBuddy({ color, main: a.kind === 'main', seed: hash(a.id), skin, palette: heroFor(a) });

// visual dos agentes (clássico, capas, armaduras), lembrado neste navegador
const SKIN_OPTIONS = { proprio: '🎲 Cada um no seu estilo', ...SKINS };
let skin = 'proprio';
try { if (SKIN_OPTIONS[localStorage.getItem('aw-skin')]) skin = localStorage.getItem('aw-skin'); } catch {}
function setSkin(next) {
  skin = next;
  try { localStorage.setItem('aw-skin', next); } catch {}
  for (const p of people.values()) { // troca o corpo de cada um, mantendo posição, nome e balão
    p.g.remove(p.buddy.root);
    p.buddy = buddyFor(p.a, p.color);
    p.g.add(p.buddy.root);
  }
}

function nameLabel(a) {
  const s = label(a.kind === 'main' ? `👑 ${a.name}` : a.name, { size: 22 });
  s.position.y = 4.2;
  return s;
}

const people = new Map();
const known = new Map(); // id -> info do agente (para recriar quem saiu e voltou)
function makePerson(a) {
  const color = colorFor(a);
  const g = new THREE.Group();
  const buddy = buddyFor(a, color);
  g.add(buddy.root);
  const name = nameLabel(a);
  g.add(name);

  const desk = desks.find(d => !d.owner) || desks[people.size % desks.length];
  desk.owner = a.id;
  g.position.copy(DOOR); // nasce na porta
  scene.add(g);
  const p = { a, g, buddy, name, desk, home: desk.home, target: desk.home.clone(), path: [], face: null,
    bubble: null, bubbleUntil: 0, lastEvent: performance.now(), color, emoteUntil: 0, pendingEmote: null,
    moving: false, attention: false, leaving: false, typing: false, seat: null };
  people.set(a.id, p);
  goTo(p, p.home, desk.face, null);
  return p;
}

function release(p) {
  if (p.seat) { p.seat.owner = null; p.seat = null; }
  p.buddy.holdMug?.(false);
  p.restKind = null;
}

function emote(p, name) { p.emoteUntil = performance.now() + p.buddy.emote(name); }

function say(p, text, ms = 5000, opts = {}) {
  if (p.bubble) p.g.remove(p.bubble);
  p.bubble = label(text, { size: 22, maxW: 360, ...opts });
  p.bubble.position.y = 5.6;
  p.g.add(p.bubble);
  p.bubbleUntil = performance.now() + ms;
}

function goTo(p, pos, face, gesture) {
  p.target.copy(pos);
  p.path = world.route(p.g.position, pos);
  p.face = face;
  p.pendingEmote = gesture;
  // já está lá: faz o gesto na hora
  if (p.g.position.distanceTo(pos) < .3 && gesture) { emote(p, gesture); p.pendingEmote = null; }
}

// o que cada um faz quando está à toa (sorteado com peso; troca depois de um tempo)
const BREAKS = [['coffee', 30], ['desk', 30], ['library', 15], ['meeting', 10], ['fountain', 15]];
const CHAT = {
  coffee: ['Esse café tá forte hoje!', 'Alguém viu o deploy de ontem?', 'Sexta tem happy hour?', 'Quem quebrou o build?', 'Tô no terceiro café já…', 'Viram a feature nova?'],
  meeting: ['E aquela retro, hein?', 'Bora alinhar a sprint?', 'Alguém anotou isso?', 'Isso dava um ADR…', 'Precisamos de mais testes.'],
  library: ['📖 Hmm, interessante…', '📖 Lendo a documentação…', '📖 Então é assim que funciona!'],
};
function pickBreak() {
  let r = Math.random() * BREAKS.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of BREAKS) if ((r -= w) < 0) return k;
  return 'desk';
}
const pickFree = list => { const free = list.filter(s => !s.owner); return free[Math.floor(Math.random() * free.length)]; };
function goRest(p) {
  const now = performance.now(), prev = p.restKind;
  release(p);
  let kind = pickBreak();
  if (kind === prev) kind = pickBreak(); // tende a variar
  p.restKind = kind;
  p.restUntil = now + 40e3 + Math.random() * 50e3;
  p.nextChat = now + 4e3 + Math.random() * 8e3;
  p.nextSip = now + 2e3;
  if (kind === 'coffee' || kind === 'fountain') {
    const spot = pickFree(kind === 'coffee' ? coffeeSpots : seats);
    if (spot) { spot.owner = p.a.id; p.seat = spot; return goTo(p, spot.pos, spot.face, null); }
    kind = p.restKind = 'desk'; // lugar cheio: fica na mesa
  }
  if (kind === 'library' || kind === 'meeting') {
    const pos = world.standAt(kind, Math.floor(Math.random() * 8)), st = stations[kind];
    return goTo(p, pos, Math.atan2(st.pos.x - pos.x, st.pos.z - pos.z), null);
  }
  goTo(p, p.home, p.desk.face, null);
}

function act(p, tool, target) {
  const st = STATION_FOR(tool);
  p.lastTool = tool;
  p.lastEvent = performance.now();
  p.attention = false;
  release(p);
  if (st === 'desk') {
    p.typing = true;
    goTo(p, p.home, p.desk.face, null);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderRoster() {

// ---------- eventos ----------
const queue = [];
let hooksOn = false;
function onEvent(ev) {
  if (ev.kind === 'meta') { hooksOn = !!ev.hooks; setStatus(true); return; }
  if (ev.kind === 'slackbot') {
    const labels = { on: '🤖 Slack bot ligado', reconnecting: '🤖 Slack bot reconectando…', error: '🤖 Slack bot com erro' };
    $('botpill').hidden = ev.state === 'off';
    $('botpill').textContent = labels[ev.state] || '';
    $('botpill').title = ev.error || 'Mande DM para o bot no Slack (só você é aceito)';
    return;
  }
  if (ev.kind === 'jira') { jiraState = ev; world.jiraBoard.render(ev, agentInfo); return; }
  if (ev.kind === 'slack') {
    slackState = ev; world.slackTV.render(ev);
    for (const m of (ev.msgs || []).filter(m => (ev.fresh || []).includes(m.id))) {
      stations.slack.heat = 1;
      feedSys(`💬 <b>${esc(m.user)}</b> em ${esc(m.channel)}: ${esc(m.text)}`, '#4a154b');
    }
    return;
  }
  if (ev.kind === 'term') { if (selected && selected.a.id === ev.id && ev.ts >= termSince) termAppend(ev.entries); return; }
  if (ev.kind === 'agent') {
    known.set(ev.agent.id, ev.agent);
    const p = people.get(ev.agent.id);
    if (p) {
      const renamed = p.a.name !== ev.agent.name;
      Object.assign(p.a, ev.agent);
      if (renamed) {
        p.g.remove(p.name); p.name = nameLabel(p.a); p.g.add(p.name);
        if (selected === p) renderHeader(p);
      }
    } else makePerson(ev.agent);
    renderRoster(); return;
  }
  // eventos de replay entram numa fila para não chegarem todos de uma vez
  if (ev.replay) queue.push(ev); else handle(ev);
}
function handle(ev) {
  let p = people.get(ev.id);
  if (!p || p.leaving) {
    if (ev.kind === 'leave' || ev.kind === 'tokens' || !known.has(ev.id)) return;
    if (p) p.leaving = false; else p = makePerson(known.get(ev.id)); // voltou ao trabalho
  }
  const now = performance.now();
  demoTerm(ev);
  switch (ev.kind) {
    case 'tool':
      act(p, ev.tool, ev.issue || ev.target);
      feed(p, `${ICON[STATION_FOR(ev.tool)]} <b>${esc(prettyTool(ev.tool))}</b> ${esc(ev.issue || ev.target || '')}`); break;
    case 'toolDone':
      if (!ev.ok) { p.failedAt = now; emote(p, 'No'); say(p, `❌ ${ev.tool} falhou`, 3000); feed(p, `❌ <b>${esc(ev.tool)}</b> falhou`); }
      break;
    case 'say':
      say(p, '💬 ' + ev.text, 6000); feed(p, '💬 ' + esc(ev.text)); p.lastEvent = now; break;
    case 'prompt':
      p.attention = false;
      say(p, (ev.human ? '🧑 ' : '📋 ') + ev.text, 5000);
      feed(p, (ev.human ? '🧑 <b>Você:</b> ' : '📋 ') + esc(ev.text)); p.lastEvent = now; break;
    case 'tokens':
      p.a.tokens = ev.total; renderRoster(); break;
    case 'sendQueued':
      say(p, `🕒 na fila (${ev.position}): ${ev.text}`, 4000);
      feed(p, `🕒 <b>Na fila (nº ${ev.position}, pelo ${ev.via === 'slack' ? 'Slack' : 'site'}):</b> ` + esc(ev.text));
      if (selected === p) termSys(`🕒 na fila (nº ${ev.position}): ${ev.text}`); break;
    case 'sendStart':
      p.attention = false; p.lastEvent = now; emote(p, 'Yes');
      say(p, '📨 ' + ev.text, 5000);
      feed(p, `📨 <b>Você (pelo ${ev.via === 'slack' ? 'Slack' : 'site'}):</b> ` + esc(ev.text));
      if (selected === p) setCStatus('Enviado. Aguardando a resposta…'); break;
    case 'sendDone':
      feed(p, ev.ok ? '✅ <b>Respondeu:</b> ' + esc(ev.text) : '❌ <b>Envio falhou:</b> ' + esc(ev.text));
      if (!ev.ok) { emote(p, 'No'); say(p, '❌ não consegui responder', 4000); }
      if (selected === p) { setCStatus(ev.ok ? 'Respondeu.' : 'Falhou: ' + ev.text, !ev.ok); if (!ev.ok) termSys('Falhou: ' + ev.text, true); }
      break;
    case 'intro': {
      const look = { capa: '🦸', armadura: '🤖', classico: '🟡' }[ev.style] || '👋';
      emote(p, 'Wave'); say(p, `👋 ${ev.text} ${look}`, 5000); p.lastEvent = now;
      feed(p, `👋 <b>${esc(ev.text)}</b> ${look}`); break;
    }
    case 'arrive':
      say(p, '👋 Cheguei!', 3000); feed(p, '👋 sessão iniciada'); p.lastEvent = now; break;
    case 'attention':
      p.attention = true; p.lastEvent = now;
      emote(p, 'Jump');
      say(p, '❗ ' + ev.text, 600e3, { bg: 'rgba(217,83,79,.95)', color: '#fff' });
      feed(p, '❗ <b>' + esc(ev.text) + '</b>'); break;
    case 'stop':
      p.attention = false; p.typing = false; release(p);
      goTo(p, p.home, p.desk.face, ev.failed ? 'No' : 'Dance');
      say(p, ev.failed ? '💥 Parei com erro' : '✅ Pronto!', 4000);
      feed(p, ev.failed ? '💥 turno falhou' : '✅ terminou o turno'); break;
    case 'leave': {
      p.leaving = true; p.attention = false; release(p);
      emote(p, 'Wave'); say(p, '👋 Tchau!', 3000);
      const parent = people.get(p.a.parent);
      if (parent) { // entrega o resultado a quem pediu
        say(parent, `📦 resultado de ${p.a.name}`, 3000); emote(parent, 'Yes');
        feed(parent, `📦 recebeu o resultado de <b>${esc(p.a.name)}</b>`);
      }
      setTimeout(() => { if (p.leaving) goTo(p, DOOR, 0, null); }, 1600);
      feed(p, '👋 saiu do escritório'); break;
    }
  }
}

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects([...people.values()].map(p => p.g), true)[0];
  if (!hit) {
    const board = raycaster.intersectObjects([world.jiraBoard.mesh, world.slackTV.mesh])[0];
    if (!board) return;
    // 1º clique: câmera de frente para o quadro; com ela de frente, clicar num card abre o link
    if (focused !== board.object) return focusOn(board.object);
    const url = (board.object === world.jiraBoard.mesh ? world.jiraBoard : world.slackTV).hit(board.uv);
    if (url && /^https:\/\//.test(url)) window.open(url, '_blank', 'noopener,noreferrer');
    return;
  }
  for (const p of people.values()) {
    let o = hit.object;
    while (o && o !== p.g) o = o.parent;
    if (o) return select(p);
  }
});

const NPCS = [];
function createNpc(cfg) {
  const key = 'aw-npc-' + cfg.id;
  let on = true;
  try { on = localStorage.getItem(key) !== 'off'; } catch {}
  const g = new THREE.Group();
  const buddy = makeBuddy({ color: '#888', skin: cfg.skin });
  g.add(buddy.root);
  const tag = label(cfg.tag, { size: 22, bg: 'rgba(43,42,51,.85)', color: '#fff' });
  tag.position.y = cfg.tagY || 4.8; g.add(tag);
  g.position.copy(cfg.spawn || DOOR);
  scene.add(g);
  const now0 = performance.now();
  const npc = { cfg, g, buddy, path: [], target: g.position.clone(), state: 'pause', until: now0 + (cfg.firstDelay || 4000),
    victim: null, nextTalk: now0 + (cfg.firstTalk || 8000), bubble: null, bubbleUntil: 0, moving: false };
  npc.say = (text, ms = 3800) => {
    if (npc.bubble) g.remove(npc.bubble);
    npc.bubble = label(text, { size: 22, maxW: 400, bg: cfg.bubbleBg || 'rgba(255,248,225,.97)' });
    npc.bubble.position.y = (cfg.tagY || 4.8) + 1.1; g.add(npc.bubble);
    npc.bubbleUntil = performance.now() + ms;
  };
  const go = pos => { npc.target.copy(pos); npc.path = world.route(g.position, pos); };
  const toward = p => { const dir = g.position.clone().sub(p.g.position).setY(0).normalize(); return p.g.position.clone().addScaledVector(dir, 1.9); };
  const btn = $(cfg.button);
  btn.classList.toggle('off', !on);
  btn.onclick = () => { on = !on; btn.classList.toggle('off', !on); try { localStorage.setItem(key, on ? 'on' : 'off'); } catch {} };
  const _v = new THREE.Vector3();
  npc.update = (dt, t, now) => {
    g.visible = on;
    if (!on) return;
    if (npc.victim && npc.state === 'walk') { // segue a pessoa se ela se mexer
      if (!isAlive(npc.victim)) { npc.victim = null; npc.until = now; }
      else if (npc.victim.g.position.distanceTo(npc.target) > 2.6) go(toward(npc.victim));
    }
    let wp = npc.path[0];
    while (wp && Math.hypot(wp.x - g.position.x, wp.z - g.position.z) < .15) { npc.path.shift(); wp = npc.path[0]; }
    if (wp) {
      _v.set(wp.x - g.position.x, 0, wp.z - g.position.z);
      const dist = _v.length(), ang = Math.atan2(_v.x, _v.z);
      g.position.addScaledVector(_v.normalize(), Math.min(dist, (cfg.speed || 4.5) * dt));
      g.rotation.y += Math.atan2(Math.sin(ang - g.rotation.y), Math.cos(ang - g.rotation.y)) * .15;
      buddy.play('Walking'); npc.moving = true;
    } else {
      if (npc.moving) { // chegou
        npc.moving = false;
        if (npc.victim && isAlive(npc.victim)) {
          const vp = npc.victim.g.position;
          g.rotation.y = Math.atan2(vp.x - g.position.x, vp.z - g.position.z);
          cfg.talkTo(npc, npc.victim, now);
          npc.until = now + 3400; npc.nextTalk = now + cfg.cooldown[0] + Math.random() * (cfg.cooldown[1] - cfg.cooldown[0]);
        } else if (npc.scripted) {
          npc.until = Infinity;
        } else if (cfg.onArrive) {
          npc.until = now + cfg.onArrive(npc, now); // ex.: o robô de limpeza começa a limpar
        } else {
          npc.until = now + 1800 + Math.random() * 2500;
          if (Math.random() < (cfg.mutterChance || .25)) npc.say(cfg.icon + ' ' + pickOne(cfg.mutters), 3000);
        }
      }
      cfg.whileIdle?.(npc, now);
      if (!buddy.busy) buddy.play('Idle');
      if (now > npc.until && !npc.scripted) {
        npc.victim = now > npc.nextTalk ? cfg.pickTarget(now) : null;
        go(npc.victim ? toward(npc.victim) : (cfg.patrol ? cfg.patrol() : patrolPoint()));
        npc.state = 'walk';
      }
    }
    g.position.y = world.groundY(g.position.x, g.position.z);
    buddy.update(dt, t);
    if (npc.bubble && now > npc.bubbleUntil) { g.remove(npc.bubble); npc.bubble = null; }
  };
  npc.isNpc = true;
  npc.a = { id: 'npc:' + cfg.id, name: cfg.name || cfg.tag.replace(/^\S+\s/, '') };
  npc.isOn = () => on;
  NPCS.push(npc);
  return npc;
}
function patrolPoint() {
  if (Math.random() < .45) return pickOne(desks).home.clone().add(new THREE.Vector3(1.6, 0, 0));
  return world.standAt(pickOne(['library', 'terminal', 'jira', 'meeting', 'mail', 'web', 'slack']), 4 + Math.floor(Math.random() * 3));
}
// sorteio com peso: cada pessoa entra na "urna" tantas vezes quanto o peso
function weightedPick(weightOf, now) {
  const urn = [];
  for (const p of people.values()) { if (p.leaving) continue; const w = weightOf(p, now); for (let i = 0; i < w; i++) urn.push(p); }
  return urn.length ? pickOne(urn) : null;
}
const isAlive = v => v.isNpc ? v.isOn() : people.has(v.a.id);
function react(p, emoteName, reply, after) {
  if (p.isNpc) { // outro personagem: para, ouve e responde
    p.path = []; p.victim = null; p.until = performance.now() + 3500;
    setTimeout(() => { if (!p.isOn()) return; p.buddy.emote(emoteName); p.say(reply, 3000); after?.(p); }, 900);
    return;
  }
  setTimeout(() => {
    if (!people.has(p.a.id)) return;
    emote(p, emoteName); say(p, reply, 3000);
    after?.(p);
  }, 900);
}

function wetFloorSign(pos) {

  for (const sd of [-1, 1]) { // placa em "A"
    const m = new THREE.Mesh(new THREE.BoxGeometry(.6, .9, .04), yellow);
    m.position.set(0, .43, sd * .16); m.rotation.x = sd * .3; m.castShadow = true; g.add(m);

  const tag = label('⚠️ Piso molhado', { size: 18, bg: 'rgba(245,197,24,.95)' }); tag.position.y = 1.35; tag.scale.multiplyScalar(.75); g.add(tag);
  scene.add(g);
  setTimeout(() => scene.remove(g), 14e3);
}

let tourTimer = null, tourToken = 0, tourLeft = 0, tourStepStart = 0, tourPaused = false;
function tourWait(token) { return ms => new Promise((res, rej) => setTimeout(() => token === tourToken ? res() : rej('cancelado'), ms)); }
function tourShow(i) {
  const prev = TOUR_STEPS[tour.i];
  prev?.leave?.();
  tour.i = Math.max(0, Math.min(TOUR_STEPS.length - 1, i));
  const st = TOUR_STEPS[tour.i];
  const token = ++tourToken;
  $('tourKicker').textContent = `${st.kicker} · ${tour.i + 1}/${TOUR_STEPS.length}`;
  $('tourTitle').textContent = st.title;
  $('tourText').textContent = st.text;
  sideVisible(st.side);
  stopFollow(); focused = null;
  if (tour.i < TOUR_STEPS.length - 1) NPCS.forEach(npcAway); // personagens fora de quadro; cada cena chama quem precisa
  st.run(tourWait(token)).catch(() => {});
  clearTimeout(tourTimer);
  tourLeft = st.ms; tourStepStart = performance.now(); tourPaused = false;
  $('tourBar').style.transition = 'none'; $('tourBar').style.width = '0%';
  requestAnimationFrame(() => { $('tourBar').style.transition = `width ${st.ms}ms linear`; $('tourBar').style.width = '100%'; });
  tourTimer = setTimeout(tourNext, st.ms);
}
function tourNext() { if (tour.i >= TOUR_STEPS.length - 1) return stopTour(); tourShow(tour.i + 1); }
function tourPause() {
  if (!tourPaused) {
    tourPaused = true; clearTimeout(tourTimer);
    tourLeft -= performance.now() - tourStepStart;
    const w = getComputedStyle($('tourBar')).width; $('tourBar').style.transition = 'none'; $('tourBar').style.width = w;
    $('tourPause').hidden = false;
  } else {
    tourPaused = false; tourStepStart = performance.now(); $('tourPause').hidden = true;
    $('tourBar').style.transition = `width ${tourLeft}ms linear`; $('tourBar').style.width = '100%';
    tourTimer = setTimeout(tourNext, tourLeft);
  }
}
function startTour() {
  if (!DEMO) { location.href = '?demo&tour'; return; } // a apresentação usa o modo demo (dados de exemplo)
  tour.on = true; tour.i = -1;
  tour.skinBefore = skin; // o tour mostra cada um no seu estilo e, no fim, devolve o visual de antes
  if (skin !== 'proprio') { $('skin').value = 'proprio'; setSkin('proprio'); }
  document.body.classList.add('touring');
  $('tour').hidden = false;
  tourShow(0);
}
function stopTour() {
  TOUR_STEPS[tour.i]?.leave?.();
  tour.on = false; ++tourToken; clearTimeout(tourTimer);
  document.body.classList.remove('touring');
  $('tour').hidden = true; $('tourPause').hidden = true; sideVisible(true);
  NPCS.forEach(n => { n.scripted = false; n.until = 0; });
  agentsList().forEach(p => { p.lastEvent = performance.now(); });
  if (tour.skinBefore && skin !== tour.skinBefore) { $('skin').value = tour.skinBefore; setSkin(tour.skinBefore); }
}
addEventListener('keydown', e => {
  if (!tour.on || /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); tourShow(tour.i + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); tourShow(tour.i - 1); }
  else if (e.key === ' ') { e.preventDefault(); tourPause(); }
  else if (e.key === 'h' || e.key === 'H') $('tourCap').classList.toggle('hidden');
  else if (e.key === 'Escape') { e.stopImmediatePropagation(); stopTour(); }
}, true);
$('tourBtn').onclick = startTour;
if (TOUR && DEMO) setTimeout(startTour, 3500); // espera os agentes entrarem
if (window.__agentWorld) Object.assign(window.__agentWorld, { tourShow, stopTour, TOUR_STEPS, tourState: tour }); // para depurar

// ---------- loop ----------
const clock = new THREE.Clock();
const IDLE_MS = 45e3, GONE_MS = 30 * 60e3;
// gira pelo caminho mais curto
function turn(p, ang, k) {
  const d = Math.atan2(Math.sin(ang - p.g.rotation.y), Math.cos(ang - p.g.rotation.y));
  p.g.rotation.y += d * k;
}
const _to = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1), t = clock.elapsedTime, now = performance.now();
  for (const [id, p] of people) {
    const idle = now - p.lastEvent;
    if (idle > IDLE_MS && !p.leaving && !p.attention && (!p.restKind || now > p.restUntil)) goRest(p);
    if (idle > GONE_MS && !p.leaving) { p.leaving = true; release(p); goTo(p, DOOR, 0, null); }

    // segue o caminho (pontos de passagem: porta de vidro, ponte)
    let wp = p.path[0];
    while (wp && Math.hypot(wp.x - p.g.position.x, wp.z - p.g.position.z) < .15) { p.path.shift(); wp = p.path[0]; }
    if (wp) {
      _to.set(wp.x - p.g.position.x, 0, wp.z - p.g.position.z);
      const dist = _to.length();
      let remaining = dist;
      for (let i = 1; i < p.path.length; i++) remaining += p.path[i].distanceTo(p.path[i - 1]);
      const run = remaining > 12;
      p.g.position.addScaledVector(_to.normalize(), Math.min(dist, (run ? 11 : 6) * dt));
      turn(p, Math.atan2(_to.x, _to.z), .2);
      p.moving = true; p.emoteUntil = 0;
      p.buddy.play(run ? 'Running' : 'Walking');
    } else {
      if (p.moving) { // acabou de chegar
        p.moving = false;
        if (p.leaving && p.target.distanceTo(DOOR) < .3) {
          scene.remove(p.g); p.desk.owner = null; people.delete(id); renderRoster(); continue;
        }
        if (p.pendingEmote) { emote(p, p.pendingEmote); p.pendingEmote = null; }
      }
      if (p.face != null) turn(p, p.face, .12);
      const atDesk = p.g.position.distanceTo(p.home) < .3;
      const atSeat = p.seat && p.g.position.distanceTo(p.seat.pos) < .3;
      const atCoffee = atSeat && p.seat.kind === 'coffee';
      if (atCoffee) p.buddy.holdMug(true);
      if (now > p.emoteUntil) {
        if (p.attention) emote(p, 'Wave');
        else if (atCoffee && now > p.nextSip) { emote(p, 'Drink'); p.nextSip = now + 4e3 + Math.random() * 4e3; } // gole
        else if ((atDesk && (p.typing || idle > 6000)) || (atSeat && !atCoffee)) p.buddy.play('Sitting');
        else p.buddy.play('Idle');
      }
      // papo na copa, na reunião e na biblioteca
      if (CHAT[p.restKind] && idle > IDLE_MS && now > p.nextChat && !p.bubble) {
        say(p, (p.restKind === 'coffee' ? '☕ ' : '💬 ') + pickOne(CHAT[p.restKind]), 3200);
        p.nextChat = now + 9e3 + Math.random() * 10e3;
      }
    }
    p.g.position.y = world.groundY(p.g.position.x, p.g.position.z);
    p.buddy.update(dt, t, p.typing && !p.moving);
    if (idle > 8000) { p.typing = false; p.desk.screen.material.color.lerp(new THREE.Color('#3a3d4a'), .02); }
    if (p.bubble && now > p.bubbleUntil) { p.g.remove(p.bubble); p.bubble = null; }
    p.name.material.opacity = idle > IDLE_MS ? .55 : 1;
  }
  for (const s of Object.values(stations)) { s.heat *= .97; s.light.intensity = s.heat * 40; }
  if (selected) {
    if (!people.has(selected.a.id)) deselect();
    else { ring.position.set(selected.g.position.x, selected.g.position.y + .05, selected.g.position.z); ring.scale.setScalar(1 + Math.sin(t * 4) * .06); }
  }
  updateNpcs(dt, t, now);
  world.update(t, dt);
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / .8);
    const k = camAnim.t * camAnim.t * (3 - 2 * camAnim.t);
    camera.position.lerpVectors(camAnim.from.pos, camAnim.to.pos, k);
    controls.target.lerpVectors(camAnim.from.target, camAnim.to.target, k);
    camera.zoom = camAnim.from.zoom + (camAnim.to.zoom - camAnim.from.zoom) * k;
    camera.updateProjectionMatrix();
    if (camAnim.t >= 1) camAnim = null;
  }
  if (following && !camAnim) { // acompanha o agente mantendo o ângulo
    if (!people.has(following.a.id)) stopFollow();
    else {
      const off = camera.position.clone().sub(controls.target);
      controls.target.lerp(following.g.position.clone().setY(1.6), Math.min(1, dt * 4));
      camera.position.copy(controls.target).add(off);
    }
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
